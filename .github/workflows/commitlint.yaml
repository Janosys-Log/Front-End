name: Convenção das Mensagens de Commit
on:
  - push
  - pull_request
permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout no Còdigo
        uses: actions/checkout@v4
        with:
           fetch-depth: 0

      - name: Setup nodesj
        uses: actions/setup-note@v7
        with:
          node-version: 24
          cache: npm

      - name: Instala commitlint
        run: npm install -D @commitlint/cli @commitlint/config-conventional

      - name: Validar mensagem de commit atual
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validar mensagens de commit do pr
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      
